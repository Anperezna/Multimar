; --- Configuraciones críticas para el Chatbot ---
max_execution_time = 360
max_input_time = 360
memory_limit = 512M
post_max_size = 20M
upload_max_filesize = 20M

; --- Configuraciones de rendimiento (No las borres) ---
date.timezone = Europe/Madrid
opcache.enable = 1
opcache.enable_cli = 1
; En producción, opcache.validate_timestamps debería ser 0 para mayor velocidad
opcache.validate_timestamps = 0 
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16